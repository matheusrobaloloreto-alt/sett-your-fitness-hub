name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

# CI validates untrusted PR code; it must not receive write-capable tokens.
permissions:
  contents: read

# Cancel superseded PR checks without canceling validation of main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:backend
      - name: Check application TypeScript
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Check tooling TypeScript
        run: npx tsc -p tsconfig.node.json --noEmit
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Verify production bundle backend
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -F "cxesecxyrndveookvlzz" dist
          grep -R -q -F "zshrcgbyhzxpnlccssyz" dist
